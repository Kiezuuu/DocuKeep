<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#172b4d">
  <title>Offline | DocuKeep</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fb;color:#243247;font:15px "Segoe UI",Arial,sans-serif}
    main{max-width:460px;text-align:center;background:#fff;border:1px solid #e3eaf2;border-radius:18px;padding:34px;box-shadow:0 18px 55px #172b4d12}
    img{width:72px;height:72px;object-fit:contain}h1{color:#172b4d;margin:16px 0 8px}p{color:#718096;line-height:1.6}
    button{border:0;border-radius:8px;background:#2862a5;color:white;padding:11px 18px;font:inherit;cursor:pointer}
  </style>
</head>
<body><main>
  <img src="icons/icon-192.png" alt="DocuKeep">
  <h1>You are offline</h1>
  <p>DocuKeep cannot reach the internet right now. Previously cached pages may still be available. Files queued on this device will upload after you reconnect and sign in.</p>
  <button onclick="location.reload()">Try again</button>
</main></body>
</html>
